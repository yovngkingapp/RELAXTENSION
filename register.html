<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear Cuenta - Mi Espacio de Calma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Crear una cuenta</h1>
      <p class="sub">Regístrate para empezar a usar tu espacio de calma.</p>
    </header>

    <form id="register-form" autocomplete="off">
      <div class="input-group">
        <label>Nombre de usuario</label>
        <input type="text" id="username" required minlength="3" maxlength="20" placeholder="Elige un usuario">
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="Mínimo 8 caracteres">
        <p class="error-text" id="pass-error">Debe tener al menos 8 caracteres, un número y un punto.</p>
      </div>

      <div class="input-group">
        <label>Repetir contraseña</label>
        <input type="password" id="password-confirm" required placeholder="Repite tu contraseña">
        <p class="error-text" id="match-error">Las contraseñas no coinciden.</p>
      </div>

      <button type="submit" id="btn-register">Crear cuenta</button>
      <p id="status" role="status"></p>
    </form>

    <div style="text-align: center; margin-top: 25px; font-size: 14px;">
      ¿Ya tienes cuenta? <a href="login.html" class="link" style="margin-top:0;">Inicia sesión aquí</a>
    </div>
  </main>

  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxSo3hR_EQIs0mpDUMlWOPjDm4mAmu00UObuuoGLY2QQJjE1QmpqjPL9u0jahRxS8Z3/exec';
    const form = document.getElementById('register-form');
    const btn = document.getElementById('btn-register');
    const status = document.getElementById('status');
    
    const passInput = document.getElementById('password');
    const passConfirm = document.getElementById('password-confirm');
    const passError = document.getElementById('pass-error');
    const matchError = document.getElementById('match-error');

    // Validación en vivo
    passInput.addEventListener('input', () => {
      const regex = /^(?=.*\d)(?=.*\.).{8,}$/;
      if (passInput.value.length > 0 && !regex.test(passInput.value)) {
        passError.style.display = 'block';
        passInput.style.borderColor = 'var(--error)';
      } else {
        passError.style.display = 'none';
        passInput.style.borderColor = 'var(--border)';
      }
    });

    passConfirm.addEventListener('input', () => {
      if (passConfirm.value.length > 0 && passInput.value !== passConfirm.value) {
        matchError.style.display = 'block';
        passConfirm.style.borderColor = 'var(--error)';
      } else {
        matchError.style.display = 'none';
        passConfirm.style.borderColor = 'var(--border)';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const regex = /^(?=.*\d)(?=.*\.).{8,}$/;
      if (!regex.test(passInput.value)) {
        status.textContent = 'La contraseña no cumple los requisitos.';
        status.className = 'err';
        return;
      }
      if (passInput.value !== passConfirm.value) {
        status.textContent = 'Las contraseñas no coinciden.';
        status.className = 'err';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creando cuenta...';
      status.textContent = '';
      
      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'registro',
            username: document.getElementById('username').value.trim(),
            password: passInput.value
          })
        });
        
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        
        status.textContent = 'Cuenta creada. Redirigiendo...';
        status.className = 'ok';
        
        localStorage.setItem('last_code', document.getElementById('username').value.trim().toLowerCase());
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);

      } catch (err) {
        status.textContent = err.message;
        status.className = 'err';
        btn.disabled = false;
        btn.innerHTML = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
