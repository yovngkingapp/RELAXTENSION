<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi Historial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card wide">
    <h1>Mi historial</h1>
    <p class="sub">Poné tu código para ver tus registros y análisis pasados.</p>

    <form id="lookup" class="bar">
      <input id="codigo" required maxlength="20" placeholder="Tu código (Ej: TEST-123)" style="text-transform:uppercase">
      <button type="submit">Ver</button>
    </form>
    
    <p id="status" role="status"></p>
    <div id="lista"></div>

    <p class="sub" style="margin-top:20px">
      <a href="index.html" class="link">← Registrar un pensamiento nuevo</a>
    </p>
  </main>

  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxSo3hR_EQIs0mpDUMlWOPjDm4mAmu00UObuuoGLY2QQJjE1QmpqjPL9u0jahRxS8Z3/exec';
    const $ = s => document.querySelector(s);
    
    const last = localStorage.getItem('last_code');
    if (last) $('#codigo').value = last;

    $('#lookup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const codigo = $('#codigo').value.trim().toUpperCase();
      if (!codigo) return;
      localStorage.setItem('last_code', codigo);

      $('#status').textContent = 'Cargando...';
      $('#status').className = '';
      $('#lista').innerHTML = '';

      try {
        const r = await fetch(ENDPOINT + '?codigo=' + encodeURIComponent(codigo));
        const d = await r.json();
        
        if (!d.ok) throw new Error(d.error || 'Error');
        
        if (!d.rows || d.rows.length === 0) {
          $('#status').textContent = 'No hay registros para este código.';
          return;
        }
        
        $('#status').textContent = d.rows.length + ' registro(s) encontrado(s).';
        // Los mostramos en orden inverso (el más nuevo arriba)
        $('#lista').innerHTML = d.rows.reverse().map(render).join('');
      } catch (err) {
        $('#status').textContent = '❌ ' + err.message;
        $('#status').className = 'err';
      }
    });

    function render(r) {
      const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const fecha = r.Fecha ? new Date(r.Fecha).toLocaleString('es') : '';
      return `
        <article class="entry">
          <header>
            <span>${esc(fecha)}</span>
            <span>Emoción: ${esc(r.EmocionInicial || '?')} → ${esc(r.EmocionFinal || '?')}</span>
          </header>
          <p><strong>Situación:</strong> ${esc(r.Situacion)}</p>
          <p><strong>Pensamiento:</strong> ${esc(r.Pensamiento)}</p>
          ${r.Distorsiones ? `<p class="tag">🔍 ${esc(r.Distorsiones)}</p>` : ''}
          ${r.Analisis ? `<p class="analisis">${esc(r.Analisis)}</p>` : ''}
        </article>`;
    }
  </script>
</body>
</html>
