<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi Historial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- BARRA DE USUARIO -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; font-size: 14px;">
      <span style="color: var(--text-light);">Historial de <strong id="user-display"></strong></span>
      <a href="#" id="btn-logout" style="color: #e53e3e; text-decoration: none; font-weight: 500;">Cerrar Sesión</a>
    </div>

    <header style="margin-top: 0;">
      <h1>Tu recorrido</h1>
      <p class="sub">Estos son los pensamientos que trabajaste.</p>
    </header>
    
    <p id="status" role="status" style="text-align: center;">Cargando tus registros...</p>
    <div id="lista"></div>

    <div style="text-align: center; margin-top: 30px;">
      <a href="index.html" class="link">← Registrar un pensamiento nuevo</a>
    </div>
  </main>

  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxSo3hR_EQIs0mpDUMlWOPjDm4mAmu00UObuuoGLY2QQJjE1QmpqjPL9u0jahRxS8Z3/exec';
    
    // ═══════════ SEGURIDAD (LOGIN) ═══════════
    const isLoggedIn = localStorage.getItem('is_logged_in');
    const currentUser = localStorage.getItem('last_code');

    if (isLoggedIn !== 'true' || !currentUser) {
      window.location.href = 'login.html';
    }

    document.getElementById('user-display').textContent = currentUser;

    document.getElementById('btn-logout').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('is_logged_in');
      localStorage.removeItem('last_code');
      window.location.href = 'login.html';
    });
    // ═════════════════════════════════════════

    const $ = s => document.querySelector(s);

    // Cargar automáticamente al abrir la página
    window.addEventListener('DOMContentLoaded', () => {
      buscarHistorial(currentUser);
    });

    async function buscarHistorial(codigo) {
      $('#status').textContent = 'Cargando...';
      $('#status').className = '';
      $('#lista').innerHTML = '';

      try {
        const r = await fetch(ENDPOINT + '?codigo=' + encodeURIComponent(codigo));
        const d = await r.json();
        
        if (!d.ok) throw new Error(d.error || 'Error');
        
        if (!d.rows || d.rows.length === 0) {
          $('#status').textContent = 'Todavía no tenés registros guardados.';
          return;
        }
        
        $('#status').textContent = `Tenés ${d.rows.length} registro(s).`;
        $('#lista').innerHTML = d.rows.reverse().map(render).join('');
      } catch (err) {
        $('#status').textContent = '❌ Error al buscar los registros.';
        $('#status').className = 'err';
      }
    }

    function render(r) {
      const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const fecha = r.Fecha ? new Date(r.Fecha).toLocaleString('es') : '';
      return `
        <article class="entry">
          <header>
            <span>${esc(fecha)}</span>
            <span>Emoción: ${esc(r.EmocionInicial || '?')} → ${esc(r.EmocionFinal || '?')}</span>
          </header>
          <p><strong>Situación:</strong> ${esc(r.Situacion)}</p>
          <p><strong>Pensamiento:</strong> ${esc(r.Pensamiento)}</p>
          ${r.Distorsiones ? `<p class="tag">🔍 ${esc(r.Distorsiones)}</p>` : ''}
          ${r.Analisis ? `<p class="analisis" style="background:#fff; padding:10px; border-radius:6px; margin-top:10px;">${esc(r.Analisis)}</p>` : ''}
        </article>`;
    }
  </script>
</body>
</html>
