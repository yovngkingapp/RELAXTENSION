<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar Sesión - RELAXTENSION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="brand-header">
    <img src="logo.png" alt="RELAXTENSION" class="brand-logo">
    <p class="slogan">Donde la calma se vuelve hábito</p>
  </header>

  <main class="card">
    <header class="app-title">
      <h1>Bienvenido de nuevo</h1>
      <p class="sub">Ingresa a tu espacio para continuar con tu hábito.</p>
    </header>

    <form id="login-form" autocomplete="off">
      <div class="input-group">
        <label>Nombre de usuario</label>
        <input type="text" id="username" required placeholder="Tu usuario">
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="Tu contraseña">
      </div>

      <button type="submit" id="btn-login">Ingresar</button>
      <p id="status" role="status"></p>
    </form>

    <div style="text-align: center; margin-top: 25px; font-size: 14px; font-family: var(--font-body);">
      ¿No tienes cuenta? <a href="register.html" class="link" style="margin-top:0;">Regístrate aquí</a>
    </div>
  </main>

  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxSo3hR_EQIs0mpDUMlWOPjDm4mAmu00UObuuoGLY2QQJjE1QmpqjPL9u0jahRxS8Z3/exec';
    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn-login');
    const status = document.getElementById('status');

    const lastUser = localStorage.getItem('last_code');
    if (lastUser) document.getElementById('username').value = lastUser;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Ingresando...';
      status.textContent = '';
      
      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'login',
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        
        status.textContent = 'Bienvenido. Redirigiendo...';
        status.className = 'ok';
        
        localStorage.setItem('last_code', data.username);
        localStorage.setItem('is_logged_in', 'true');
        
        setTimeout(() => { window.location.href = 'index.html'; }, 1000);

      } catch (err) {
        status.textContent = err.message;
        status.className = 'err';
        btn.disabled = false;
        btn.innerHTML = 'Ingresar';
      }
    });
  </script>
</body>
</html>
